name: Build and Publish Docker Image

# Fires only when a GitHub Release is explicitly published.
# Draft and unpublished releases do NOT trigger this workflow.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push multi-platform image
    runs-on: ubuntu-latest

    steps:
      # ── 1. Lowercase image name ────────────────────────────────────────────
      # github.repository preserves the owner's original casing (e.g.
      # "JakeWard98/qbitread-alpine"). Docker registry refs must be fully
      # lowercase, so we convert once here and use IMAGE_NAME for all
      # subsequent steps.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # ── 2. QEMU for cross-platform emulation ───────────────────────────────
      # Allows the amd64 runner to build ARM64 images via software emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      # ── 3. Docker Buildx ───────────────────────────────────────────────────
      # Required for multi-platform builds and registry-based layer caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      # ── 4. Log in to GHCR ─────────────────────────────────────────────────
      # Uses the auto-injected GITHUB_TOKEN — no manual secrets required.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Extract Docker metadata ─────────────────────────────────────────
      # Given a stable release tag of v1.2.3, this generates:
      #   ghcr.io/jakeward98/qbitread-alpine:1.2.3
      #   ghcr.io/jakeward98/qbitread-alpine:1.2
      #   ghcr.io/jakeward98/qbitread-alpine:1
      #   ghcr.io/jakeward98/qbitread-alpine:latest
      # Given a pre-release tag of v1.2.3-beta.1, this generates:
      #   ghcr.io/jakeward98/qbitread-alpine:1.2.3-beta.1
      #   ghcr.io/jakeward98/qbitread-alpine:beta
      #   (latest is NOT updated for pre-releases)
      # OCI-standard labels (org.opencontainers.image.*) are also attached.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=beta,enable=${{ github.event.release.prerelease }}

      # ── 6. Build and push ──────────────────────────────────────────────────
      # Registry cache (type=registry, mode=max) is used instead of type=gha
      # because concurrent multi-platform builds write cache layers in parallel;
      # the GHA cache backend cannot handle concurrent writes from multiple
      # platforms. The registry backend stores cache manifests in GHCR alongside
      # the image and handles this correctly.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294  # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # ── 7. Print image digest ──────────────────────────────────────────────
      # The sha256 digest is the immutable identifier for this exact build.
      # Useful for pinning in production deployments and for audit trails.
      - name: Print image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"
