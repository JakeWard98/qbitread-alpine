<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - qBit Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/style.css?v=3">
</head>
<body x-data="loginApp">
  <header>
    <h1>q<span>Bit</span> Dashboard</h1>
  </header>
  <div class="login-wrap">
    <div class="login-box">
      <h2>Sign In</h2>
      <form @submit.prevent="submit">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="username" required x-model="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required x-model="password">
        </div>
        <button type="submit" class="btn-primary login-btn" :disabled="submitting">Sign In</button>
      </form>
      <div class="login-error" x-show="hasError" x-text="errorText"></div>
    </div>
  </div>
  <script defer data-cfasync="false" src="/static/js/shared.js?v=3"></script>
  <script defer data-cfasync="false" src="/static/js/login.js?v=3"></script>
  <script defer data-cfasync="false" src="/static/js/vendor/alpine-csp.min.js?v=3"></script>
</body>
</html>
