services:
  qbitread:
    image: ghcr.io/jakeward98/qbitread-alpine:latest
    container_name: qbitread
    restart: unless-stopped
    ports:
      # To restrict to localhost only: "127.0.0.1:8112:8000"
      - "8112:8000"
    environment:
      - QBIT_HOST=${QBIT_HOST:?Set QBIT_HOST in .env}
      - QBIT_USERNAME=${QBIT_USERNAME:-admin}
      - QBIT_PASSWORD=${QBIT_PASSWORD:?Set QBIT_PASSWORD in .env}
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - QBIT_BROWSER_HOST=${QBIT_BROWSER_HOST:-}
      - JWT_EXPIRY_MINUTES=${JWT_EXPIRY_MINUTES:-720}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-5}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - REFRESH_RATE=${REFRESH_RATE:-5}
      - ENABLE_BROWSER_AUTH=${ENABLE_BROWSER_AUTH:-false}
    volumes:
      - qbitread_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qbitread_data:
